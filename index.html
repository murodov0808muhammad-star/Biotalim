<style>
:root{--bg:#f7f5ff;--sf:#fff;--ink:#2d2a4a;--mut:#7d78a0;--ln:#ebe7fb;--pr:#5c7cfa;--gn:#37b97a;--yl:#fff2b8;--sk:#cfe8ff;--mn:#d8f5e3;--pe:#ffd9c7;--rd:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:480px;margin:0 auto;overflow:hidden;position:relative}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px 28px}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1{font-size:25px;margin:0 0 4px}h2{font-size:18px;margin:22px 0 10px}h3{font-size:16px;margin:10px 0 4px}
p{margin:0 0 8px}.mut{color:var(--mut);font-size:14px}
.card{background:var(--sf);border:0;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(92,80,180,.08);width:100%;text-align:left;display:block}
button.card{cursor:pointer;transition:transform .12s}button.card:active{transform:scale(.97)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.btn{background:var(--pr);color:#fff;border:0;border-radius:18px;padding:14px 18px;font-weight:700;width:100%;min-height:52px;cursor:pointer;box-shadow:0 5px 0 #4560d0;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4560d0}
.btn.alt{background:var(--sf);color:var(--pr);box-shadow:0 4px 0 var(--ln);border:2px solid var(--ln)}
.btn.alt:active{box-shadow:0 1px 0 var(--ln)}
.btn.sm{width:auto;padding:9px 14px;min-height:40px;font-size:14px;box-shadow:none}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.opt:focus-visible,.cell:focus-visible{outline:3px solid #9bb3ff;outline-offset:2px}
input,select,textarea{width:100%;background:#fff;border:2px solid var(--ln);border-radius:14px;padding:12px;margin:6px 0 14px;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr)}
label{font-size:14px;color:var(--mut);font-weight:600}
nav{display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;background:none;border:0;padding:6px 2px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;border-radius:14px;margin:4px 2px}
.tab .ic{font-size:21px;line-height:1.2;transition:transform .25s}
.tab[aria-current=page]{color:var(--pr);font-weight:700;background:var(--sk)}
.tab[aria-current=page] .ic{animation:bob 1.6s ease-in-out infinite}
.bar{height:12px;background:var(--ln);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gn),#7be0a8);border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.s0{background:#eef0f7;color:var(--mut)}.s1{background:var(--sk);color:#2a5fb5}.s2{background:var(--yl);color:#8a6a00}.s3{background:var(--mn);color:#1f8a52}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{border:0;background:#fff;border-radius:20px;padding:9px 15px;white-space:nowrap;font-size:14px;font-weight:600;box-shadow:0 2px 6px rgba(92,80,180,.08);cursor:pointer;transition:transform .15s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed=true]{background:var(--pr);color:#fff}
.hero{background:linear-gradient(135deg,#5c7cfa,#9b8cff);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero .bar{background:rgba(255,255,255,.35)}.hero .bar i{background:#fff}
.hero .blob{position:absolute;right:-6px;top:-10px;font-size:92px;opacity:.3;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.qa{border:0;border-radius:20px;padding:16px 10px;text-align:center;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(92,80,180,.1);font-size:15px;color:var(--ink);background:#fff;transition:transform .12s}
.qa:active{transform:scale(.94)}
.qa .e{display:block;font-size:32px;margin-bottom:4px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.in{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stats div{border-radius:18px;padding:12px 6px;text-align:center}.stats b{display:block;font-size:22px}
.fact{background:var(--yl);border-radius:20px;padding:16px;margin-bottom:12px;font-size:15px}
.opt{display:block;width:100%;background:#fff;border:2px solid var(--ln);border-radius:16px;padding:15px;margin-bottom:10px;text-align:left;font-size:16px;cursor:pointer;font-weight:600;transition:background .2s,transform .1s}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--mn);border-color:var(--gn);animation:okp .5s ease}
.opt.no{background:#ffe1e3;border-color:var(--rd);animation:shk .4s ease}
.opt:disabled{cursor:default}
@keyframes okp{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.qc.okp{animation:okp .5s ease}.qc.shk{animation:shk .4s ease}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{aspect-ratio:3/4;border:0;border-radius:16px;font-size:12px;font-weight:700;padding:6px;cursor:pointer;background:linear-gradient(135deg,#9b8cff,#5c7cfa);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 3px 8px rgba(92,80,180,.2);line-height:1.25;animation:pop .35s ease both}
.cell.open{background:#fff;color:var(--ink);border:2px solid var(--ln)}
.cell.done{background:var(--mn);color:#1f8a52}
.cell:disabled{cursor:default}
.node{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.nd{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;background:#fff;box-shadow:0 4px 10px rgba(92,80,180,.12);flex:none;cursor:pointer;border:0;transition:transform .15s}
.nd:active{transform:scale(.9)}
.nd.open{background:linear-gradient(135deg,#5c7cfa,#9b8cff);color:#fff}
.nd.cur{animation:ring 1.8s ease-out infinite}
.nd.lock{background:#eef0f7;color:var(--mut);cursor:default}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(92,124,250,.55)}100%{box-shadow:0 0 0 16px rgba(92,124,250,0)}}
.ninfo{flex:1;min-width:0}.ninfo b{display:block}.ninfo span{font-size:15px;color:#f0b400;letter-spacing:2px}
.climb{font-size:30px;animation:climb 1.4s ease-in-out infinite;flex:none}
@keyframes climb{50%{transform:translateY(-6px) rotate(-6deg)}}
.grade{width:58px;flex:none}
.warn{background:var(--pe);color:#9a4a1f;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:5;overflow-y:auto;max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
ol,ul{padding-left:20px;margin:6px 0 10px}li{margin-bottom:5px}
.cf{position:fixed;top:-30px;z-index:9;pointer-events:none;font-size:22px;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
.pop{animation:pop .4s ease}@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.leaf{position:fixed;font-size:22px;opacity:.22;pointer-events:none;z-index:0;animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(12deg)}}
.toggle{width:52px;height:30px;border-radius:20px;border:0;background:var(--ln);position:relative;cursor:pointer;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle[aria-checked=true]{background:var(--gn)}.toggle[aria-checked=true]::after{transform:translateX(22px)}
.star{font-size:26px;background:none;border:0;cursor:pointer;color:var(--ln);padding:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v5: yangi ranglar va animatsiyalar ===== */

.card{box-shadow:0 6px 18px rgba(92,80,180,.10)}
.chip[aria-pressed=true]{background:linear-gradient(90deg,#7c5cff,#ff6fa8)}
.opt{border-left:8px solid #ffb703}

.nd{position:relative}

.pt{position:fixed;pointer-events:none;z-index:9;font-size:22px;animation:burst .95s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2) rotate(200deg);opacity:0}}

nav{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}

else if(w.st==1)h+='<div class="card"><label for="fl">Ishingiz fayli (PDF, Word, taqdimot)</label><input id="fl" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx">'+(w.file?'<p class="mut">✅ Tanlangan: '+esc(w.file)+'</p>':'<p class="mut">Hali fayl tanlanmagan.</p>')+'<button class="btn" id="sv">Yuborish 🚀</button><p id="er" role="alert" style="color:var(--rd)"></p></div>';
else h+='<div class="card pop" style="text-align:center"><div style="font-size:50px">📬</div><p>Ish yuborilgan. Natija o‘qituvchi tomonidan tekshiriladi.</p></div>';

m.innerHTML='<h1>👤 Profil</h1><div class="card"><h3 style="margin:0">'+esc(u.n)+'</h3><p class="mut" style="margin:4px 0 0">'+esc(u.f)+'</p></div>'
+'<div class="card row sp"><div><h3 style="margin:0">🔊 Ovoz va tebranish</h3><p class="mut" style="margin:0">O‘yinda tovush va signal</p></div><button class="toggle" id="snd" role="switch" aria-checked="'+S.snd+'" aria-label="Ovoz"></button></div>'
+'<div class="card"><h3>🏆 Natijalar</h3><p style="margin:0">Ochilgan bosqich: <b>'+Math.min(S.unlock,10)+'/10</b></p><p style="margin:4px 0 0">Juftlik eng kam harakat: <b>'+(S.best.m==null?'—':S.best.m)+'</b></p></div>'

/* ===== v5: tovushlar, animatsiyalar, topshiriq yuklash, juftlik ===== */
var LC=['#5c7cfa','#37b97a','#f0b400','#ff8fab','#9b72e8'];
(function(){var b=document.createElement('div');b.innerHTML='<span class="bg-blob b1"></span><span class="bg-blob b2"></span><span class="bg-blob b3"></span>';document.body.insertBefore(b,document.body.firstChild)})();
var AC=null;
function actx(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!AC)AC=new C();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
document.addEventListener('pointerdown',function(){actx()},{once:true});
function tone(f,t0,d,type,vol,to){var c=actx();if(!c)return;var t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.03)}
function beep(f,d){if(!S.snd)return;tone(f,0,d||0.1,'sine',0.12)}
var SOUNDS={ok:[[523,0],[659,.09],[784,.18]],bad:[[330,0,'sawtooth'],[247,.14,'sawtooth']],win:[[523,0],[659,.11],[784,.22],[1047,.36]],tap:[[880,0,'triangle']],flip:[[420,0,'triangle',640]],tick:[[1200,0,'square']],lose:[[392,0],[330,.16],[262,.32]]};
function chime(k){if(!S.snd)return;(SOUNDS[k]||[]).forEach(function(n){tone(n[0],n[1],k=='tap'?0.05:(k=='tick'?0.04:0.2),n[2]||'triangle',k=='bad'?0.07:0.13,n[3])})}
document.addEventListener('pointerdown',function(e){if(S.snd&&e.target.closest&&e.target.closest('button'))tone(880,0,0.04,'triangle',0.04)},true);
function confetti(){chime('win');var E=['🎉','⭐','🎈','🌟','🧬','🌿','🏔','💖'];for(var i=0;i<34;i++){var s=document.createElement('span');s.className='cf';s.textContent=E[i%E.length];s.style.left=(Math.random()*100)+'vw';s.style.animationDelay=(Math.random()*.7)+'s';document.body.appendChild(s);(function(el){setTimeout(function(){el.remove()},4000)})(s)}}
function burst(el,E){if(!el)return;var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;E=E||['⭐','✨','💫','🎉'];
for(var i=0;i<12;i++){var s=document.createElement('span');s.className='pt';s.textContent=E[i%E.length];s.style.left=cx+'px';s.style.top=cy+'px';var a=Math.random()*6.283,d=40+Math.random()*70;s.style.setProperty('--x',(Math.cos(a)*d)+'px');s.style.setProperty('--y',(Math.sin(a)*d)+'px');document.body.appendChild(s);(function(x){setTimeout(function(){x.remove()},1000)})(s)}}

function ansQ(k){if(C.lock)return;C.lock=true;C.pk=k;var q=C.qs[C.i];var el=document.querySelector('#sheet [data-k="'+k+'"]');
if(k==q.a){C.c++;C.fb='ok';chime('ok');vib(30);burst(el,['⭐','✨','🎉','💖'])}else{C.fb='no';chime('bad');vib([60,40,60])}
drawQ()}
function ansBlitz(k){if(curGame!=='blitz')return;var q=BZ.qs[BZ.i%BZ.qs.length];var el=document.querySelector('#sheet [data-k="'+k+'"]');
if(k==q.a){BZ.c++;chime('ok');vib(20);burst(el,['⚡','✨'])}else{BZ.w++;chime('bad');vib([50,30,50])}BZ.i++;drawBlitz()}
function startBlitz(){BZ={t:60,c:0,w:0,i:0,qs:shuffle(ALLQ.slice())};curGame='blitz';drawBlitz();clearInterval(BZI);BZI=setInterval(function(){if(curGame!=='blitz'){clearInterval(BZI);return}BZ.t--;if(BZ.t<=0){clearInterval(BZI);endBlitz();return}if(BZ.t<=5)chime('tick');var el=$('bzt'),b=$('bzb');if(el)el.textContent=BZ.t+' s';if(b)b.style.width=(BZ.t/60*100)+'%'},1000)}

function drawMem(){var pairs=mm.dn.filter(Boolean).length/2;var h=head('🃏 Juftlik o‘yini')+'<div class="row sp" style="margin:4px 0 10px"><span class="badge s3">Harakat: '+mm.mv+'</span><span class="badge s2">Juftlik: '+pairs+'/'+MEMP.length+'</span></div><div class="mem">';
mm.c.forEach(function(c,i){var show=mm.dn[i]||mm.op.indexOf(i)>-1;var cls=mm.dn[i]?'cell done':show?'cell open':'cell';if(mm.last===i&&show&&!mm.dn[i])cls+=' new';
h+='<button class="'+cls+'" data-i="'+i+'"'+(show||mm.lock?' disabled':'')+'>'+(show?esc(c.t):'❔')+'</button>'});
h+='</div>';var s=sheetOpen(h);on(s,'.cell',function(b){flipMem(+b.dataset.i)})}
function flipMem(i){if(mm.lock||mm.dn[i]||mm.op.indexOf(i)>-1)return;mm.op.push(i);mm.last=i;chime('flip');
if(mm.op.length==2){mm.mv++;mm.lock=true;var a=mm.op[0],b=mm.op[1];drawMem();
setTimeout(function(){if(curGame!=='mem')return;
if(mm.c[a].p==mm.c[b].p){mm.dn[a]=true;mm.dn[b]=true;mm.last=-1;chime('ok');vib(40);burst(document.querySelector('#sheet [data-i="'+a+'"]'),['💖','✨']);burst(document.querySelector('#sheet [data-i="'+b+'"]'),['🧬','💖']);
if(mm.dn.every(Boolean)){finishMem();return}}
else{mm.last=-1;chime('bad');vib(20)}
mm.op=[];mm.lock=false;drawMem()},700)}
else drawMem()}

if(w.st<2){
h+='<div class="card"><h3>📤 Ishingizni yuklang</h3><p class="mut">Fayl (PDF, Word, taqdimot) yoki telefondagi surat.</p><button class="btn" id="bf">📄 Fayl tanlash</button><button class="btn alt" id="bi" style="margin-top:10px">🖼 Surat tanlash</button><input id="fl" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt" hidden><input id="fi" type="file" accept="image/*" hidden>'+(w.file?'<p style="margin:12px 0 0">✅ <b>'+esc(w.file)+'</b></p>':'<p class="mut" style="margin:12px 0 0">Hali fayl tanlanmagan.</p>')+'<button class="btn" id="sv" style="margin-top:12px">Yuborish 🚀</button><p id="er" role="alert" style="color:var(--rd)"></p></div>';
}else h+='<div class="card pop" style="text-align:center"><div style="font-size:50px">📬</div><p>Ish yuborilgan. Natija o‘qituvchi tomonidan tekshiriladi.</p></div>';
sheetOpen(h);
var g=function(i){return $(i)};
if(w.st<2){
 g('bf').onclick=function(){g('fl').click()};
 g('bi').onclick=function(){g('fi').click()};
 var pick=function(inp){inp.onchange=function(){var f=this.files&&this.files[0];if(f){PF[id]=f;w.file=f.name;if(w.st<1)w.st=1;save();chime('ok');openTask(id)}}};
 pick(g('fl'));pick(g('fi'));
 g('sv').onclick=function(){if(!w.file){g('er').textContent='Avval faylni tanlang.';return}
  var f=PF[id],done=function(){w.st=2;save();chime('win');vib(40);confetti();openTask(id)};
  if(!f){g('er').textContent='Faylni qayta tanlang (ilova yangidan ochilgan bo‘lishi mumkin).';return}
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({title:'Topshiriq '+id,text:'Topshiriq '+id+': '+t.t,files:[f]}).then(done,function(){g('er').textContent='Yuborish bekor qilindi.'})}
  else{g('er').innerHTML='<a href="'+URL.createObjectURL(f)+'" download="'+esc(f.name)+'" style="color:#6446e8;font-weight:700">📥 Faylni yuklab olish</a><br><span class="mut">Faylni o‘qituvchiga o‘zingiz yuboring, so‘ng pastdagi tugmani bosing.</span>';g('sv').textContent='Yuborildi, belgilash ✅';g('sv').onclick=done}};
}}

render();
